name: Build and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # Trigger on semantic version tags like v1.0.0, v2.1.3, etc.
      - 'v[0-9]+.[0-9]+.[0-9]+-*'  # Also support pre-release tags like v1.0.0-beta.1

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating releases and uploading assets
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Extract version from tag
        id: version
        run: |
          # Extract version from tag (e.g., v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          
          # Detect if this is a pre-release (contains beta, alpha, rc, etc.)
          if [[ "$VERSION" =~ (beta|alpha|rc|preview|pre) ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "Detected pre-release version: $VERSION"
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "Detected stable version: $VERSION"
          fi
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Update package.json version
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version
          echo "Updated package.json to version ${{ steps.version.outputs.version }}"
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found after build"
            exit 1
          fi
          echo "Build output verified successfully"
      
      - name: Create release archive
        run: |
          cd dist
          zip -r ../cgf-propresenter-nurserymessages-${{ steps.version.outputs.version }}.zip .
          cd ..
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Release ${{ steps.version.outputs.version }}
            
            ### Download
            Download the attached `cgf-propresenter-nurserymessages-${{ steps.version.outputs.version }}.zip` file and extract it to your web server.
            
            ### Installation
            1. Download the zip file below
            2. Extract the contents to your web server directory
            3. Configure your web server to serve the files
            4. Access the application in your browser
            
            See the [README](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/README.md) for more details.
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            cgf-propresenter-nurserymessages-${{ steps.version.outputs.version }}.zip
